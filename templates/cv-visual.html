<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{titulo}}</title>
<style>
:root{--navy:#0b162a;--blue:#1d4ed8;--sky:#0ea5e9;--ink:#142136;--muted:#536179;--line:#dce5ef}
*{box-sizing:border-box}
@page{size:A4;margin:10mm 12mm}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",Arial,"Liberation Sans","DejaVu Sans",sans-serif;font-size:10.4pt;line-height:1.42}
body{overflow-wrap:anywhere}
.hero{padding:7mm 8mm 6mm;margin:0 0 5mm;color:#fff;background:linear-gradient(125deg,#080f1c,#0f2444 52%,#1a3a6e);display:flex;gap:20px;align-items:center;border-radius:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.portrait{flex:none;width:96px;height:96px;border:3px solid #38bdf8;border-radius:50%;background:#e7edf5;object-fit:cover}
.identity{min-width:0}
h1{margin:0 0 5px;font-size:24pt;line-height:1.08;letter-spacing:-.5px}
.role{font-size:12pt;font-weight:600;color:#a8dcff;margin:0 0 8px}
.contact{margin:0;font-size:9.2pt;color:#e5edfa}
.contact span+span::before{content:" · "}
.impact{display:flex;margin:0 0 5mm;border:1px solid var(--line);border-radius:10px;background:#f5f8ff;overflow:hidden;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.stat{flex:1;min-width:0;padding:10px 12px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat strong{display:block;font-size:19pt;line-height:1.1;color:var(--blue)}
.stat span{display:block;margin-top:4px;font-size:8.7pt;color:var(--muted)}
h2{font-size:12.5pt;color:var(--blue);margin:5mm 0 2.5mm;padding-bottom:1.5mm;border-bottom:1px solid var(--line);font-weight:700;break-after:avoid}
h3{font-size:11.2pt;margin:0;line-height:1.3}
p{margin:0 0 2.5mm}
.job{border-left:3px solid var(--blue);padding:0 0 0 12px;margin:3mm 0 4.5mm}
.job-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:2mm;break-after:avoid}
.company{font-weight:700;color:var(--blue);font-size:10pt;margin:0}
.dates{white-space:nowrap;color:var(--muted);font-size:9pt;margin:3px 0 0}
.intro{color:var(--muted);font-size:10pt;margin-bottom:2mm}
ul{padding-left:16px;margin:0}
li{margin:0 0 1.6mm;break-inside:avoid}
li::marker{color:var(--blue)}
.compact{margin:0 0 3mm;padding-left:12px;border-left:3px solid #a5c5f9;break-inside:avoid}
.institution{color:var(--muted);margin:2px 0 0;font-size:10pt}
.skill-list p{margin-bottom:2mm;font-size:10pt}
.skill-list strong{color:var(--blue)}
.languages{background:#f4f7fc;border-radius:8px;padding:9px 12px;font-size:10pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
</head>
<body>
{{conteudo}}
</body>
</html>
