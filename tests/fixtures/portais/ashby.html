<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Application - Empresa 03</title></head>
<body>
<div id="root">
  <form class="ashby-application-form" action="#confirmacao">
    <div class="field-entry"><label class="ashby-label" id="lbl-name">Name<span aria-hidden="true">*</span></label><input aria-labelledby="lbl-name" aria-required="true" name="_systemfield_name"></div>
    <div class="field-entry"><label class="ashby-label" id="lbl-email">Email<span aria-hidden="true">*</span></label><input type="email" aria-labelledby="lbl-email" aria-required="true" name="_systemfield_email"></div>
    <div class="field-entry"><label class="ashby-label" id="lbl-resume">Resume</label><input type="file" aria-labelledby="lbl-resume" name="_systemfield_resume"></div>
    <div class="field-entry"><input aria-label="Years of experience with product management" name="q1" type="number" required></div>
    <fieldset><legend>Will you now or in the future require sponsorship?</legend>
      <label><input type="radio" name="q2" value="yes" required> Yes</label>
      <label><input type="radio" name="q2" value="no"> No</label>
    </fieldset>
    <button type="submit">Submit Application</button>
  </form>
</div>
</body></html>
