<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Empresa 04 - Gerente de Produto - Gupy</title></head>
<body>
<h1>Perguntas da vaga</h1>
<form id="perguntas" action="#confirmacao">
  <div><p class="question-title">Qual a sua pretensão salarial?</p><input name="pergunta_1" required></div>
  <div><p class="question-title">Você possui disponibilidade para trabalho híbrido em Cidade Exemplo?</p>
    <label><input type="radio" name="pergunta_2" value="sim" required> Sim</label>
    <label><input type="radio" name="pergunta_2" value="nao"> Não</label></div>
  <div><p class="question-title">Você é uma pessoa com deficiência (PcD)?</p>
    <select name="pergunta_3" required><option value="">Selecione</option><option>Sim</option><option>Não</option><option>Prefiro não informar</option></select></div>
  <div><p class="question-title">Conte sobre um projeto em que você liderou uma migração.</p><textarea name="pergunta_4" required></textarea></div>
  <div><p class="question-title">Quais ferramentas você usa?</p>
    <label><input type="checkbox" name="ferramentas" value="jira"> Jira</label>
    <label><input type="checkbox" name="ferramentas" value="sql"> SQL</label>
    <label><input type="checkbox" name="ferramentas" value="figma"> Figma</label></div>
  <button type="submit">Finalizar candidatura</button>
</form>
</body></html>
